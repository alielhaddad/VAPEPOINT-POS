name: Publish signed SOHO VAPE licenses

on:
  push:
    branches: [main]
    paths:
      - 'licenses/registry.json'
      - 'scripts/sign-license-manifest.cjs'
      - '.github/workflows/publish-license-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build signed manifest
        env:
          LICENSE_SIGNING_PRIVATE_KEY: ${{ secrets.LICENSE_SIGNING_PRIVATE_KEY }}
        run: node scripts/sign-license-manifest.cjs

      - name: Commit signed manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add licenses/manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "Publish signed SOHO VAPE license manifest"
            git push
          fi
